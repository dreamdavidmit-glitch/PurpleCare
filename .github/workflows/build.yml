name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_self_tests:
        description: Run synthetic self-tests (no real repairs or browser backups)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile
        shell: powershell
        run: ./scripts/build.ps1
      - name: Optional synthetic self-tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_self_tests }}
        shell: powershell
        run: ./scripts/test.ps1 -SkipBuild
      - name: Package without runtime data
        shell: powershell
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PurpleCare-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
